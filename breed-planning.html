<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breed Planning Card View</title>
<style>
:root{
  --bg:#f7f8fb; --panel:#fff; --border:#d9dee8; --text:#111827;
  --muted:#6b7280; --accent:#ff9800; --blue:#3b82f6; --column:#eef1f5;
  --purple:#8b5cf6;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.topbar{height:68px;background:#fff1d7;display:flex;align-items:center;padding:0 22px;gap:28px;border-bottom:1px solid #f0dfbf}
.brand{font-size:30px;font-weight:800;color:#6d1b2c;margin-right:8px}
.nav-item{font-size:13px;font-weight:600}.hello{margin-left:auto;color:#777;font-size:13px}
.page{padding:28px 34px}
.frame{background:#fff;border:1px solid var(--border);border-radius:8px;padding:34px 16px 20px}
.planner-head{display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:8px;padding:20px 22px;margin-bottom:18px;flex-wrap:wrap}
.title-wrap{min-width:300px;margin-right:auto}
.title-wrap h1{margin:0 0 4px;font-size:22px}.title-wrap p{margin:0;color:var(--muted);font-size:12px}
.toggle{display:flex;border:1px solid var(--border);border-radius:22px;overflow:hidden}
.toggle button{border:0;background:#fff;padding:10px 15px;font-weight:700}
.toggle .active{background:var(--accent);color:#fff;border-radius:20px}
.navigator{display:flex;gap:8px}
.circle-btn{width:38px;height:38px;border:1px solid var(--border);border-radius:50%;background:#fff;font-size:20px;cursor:pointer}
.date-control{position:relative}
.today-btn{height:42px;border:1px solid var(--border);border-radius:22px;background:#fff;padding:0 16px;font-weight:700;cursor:pointer}
.today-btn:hover{background:#f7f8fb}
.date-btn{height:42px;min-width:310px;border:1px solid var(--border);border-radius:22px;background:#fff;padding:0 12px;display:flex;align-items:center;gap:9px;cursor:pointer}
.date-text{font-size:12px}
.week-badge{margin-left:auto;border:1px solid #b76cff;background:#faf5ff;color:#7e22ce;border-radius:14px;padding:5px 9px;font-size:11px;font-weight:600}
.view-mode,.phase-select{height:42px;border:1px solid var(--border);border-radius:8px;background:#fff;padding:0 12px}
.search{height:42px;border:1px solid var(--border);border-radius:22px;padding:0 14px}
.icon-btn{width:42px;height:42px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:#f7f8fb}
.filter-btn svg{width:18px;height:18px;stroke:#475569}
.filter-btn.active{border-color:#ff9800;background:#fff8eb}

.filter-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(38,49,66,.55);
}
.filter-overlay.show{display:flex}
.filter-modal{
  width:min(930px,calc(100vw - 32px));
  max-height:calc(100vh - 48px);
  overflow:auto;
  background:#fff;
  border:1px solid #d8dee9;
  border-radius:16px;
  box-shadow:0 22px 55px rgba(15,23,42,.22);
}
.filter-modal-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:24px;
  padding:22px 24px;
  border-bottom:1px solid #e2e8f0;
}
.filter-modal-title{margin:0 0 4px;font-size:24px;font-weight:800;color:#0f172a}
.filter-modal-subtitle{margin:0;color:#52627a;font-size:13px;font-weight:600}
.filter-close{
  width:40px;
  height:40px;
  border:1px solid #d7deea;
  border-radius:50%;
  background:#fff;
  color:#6d1b2c;
  font-size:25px;
  line-height:1;
  cursor:pointer;
}
.filter-close:hover{background:#f8fafc}
.filter-form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
  padding:26px 24px 24px;
}
.filter-field{display:flex;flex-direction:column;gap:9px;min-width:0}
.filter-field label{font-size:13px;font-weight:800;color:#18233a}
.filter-field select,
.filter-field input{
  width:100%;
  height:46px;
  border:1px solid #cfd8e7;
  border-radius:11px;
  background:#fff;
  color:#394a65;
  padding:0 14px;
  font:600 13px Arial,Helvetica,sans-serif;
  outline:none;
}
.filter-field select:focus,
.filter-field input:focus{border-color:#8ab4ff;box-shadow:0 0 0 3px rgba(59,130,246,.10)}
.filter-field input[type="date"]{color:#394a65}
.filter-field input[type="date"]:invalid{color:#64748b}
.filter-modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:12px;
  padding:16px 24px;
  border-top:1px solid #e2e8f0;
}
.filter-action{
  min-width:132px;
  height:44px;
  border-radius:11px;
  border:1px solid #cfd8e7;
  background:#fff;
  color:#18233a;
  font-weight:800;
  cursor:pointer;
}
.filter-action.apply{background:#ff9800;border-color:#ff9800;color:#fff}
.filter-action:hover{filter:brightness(.98)}
@media (max-width:700px){
  .filter-form-grid{grid-template-columns:1fr}
  .filter-modal{width:min(560px,calc(100vw - 20px))}
}

.calendar-pop{position:absolute;top:48px;left:0;width:365px;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 12px 32px rgba(15,23,42,.18);padding:16px;z-index:20;display:none}
.calendar-pop.show{display:block}
.calendar-top{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;margin-bottom:16px}
.calendar-title{text-align:center;font-size:17px;font-weight:700;color:#2b2f4a}
.calendar-nav{border:0;background:#fff;font-size:24px;cursor:pointer;color:#5b647a}
.calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calendar-weekdays{margin-bottom:6px;color:#737990;font-size:12px;text-align:center}
.calendar-day{height:38px;border:0;border-radius:4px;background:#f5f6f8;color:#2e344b;cursor:pointer;font-size:12px}
.calendar-day.outside{background:transparent;color:#a9afbd}
.calendar-day.in-range{background:#efe7ff;color:#8b5cf6}
.calendar-day.range-start,.calendar-day.range-end{background:var(--purple);color:#fff;font-weight:700}
.calendar-day.today{background:#60a5fa;color:#fff;font-weight:700}
.calendar-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.calendar-actions button{min-width:118px;border:1px solid var(--border);border-radius:20px;padding:10px 14px;background:#fff;cursor:pointer;font-weight:600}
.calendar-actions .apply{background:#211747;color:#fff;border-color:#211747}
.calendar-actions .clear{color:#ff5b79}

.mode-note{font-size:12px;color:var(--muted);margin:0 0 12px}
.planning-grid{display:grid;grid-template-columns:repeat(7,minmax(230px,230px));gap:12px;overflow-x:auto;overflow-y:hidden;border-top:1px solid var(--border);padding-top:14px;padding-bottom:14px;width:100%;scrollbar-gutter:stable;scroll-behavior:smooth}
.day-col{background:var(--column);min-height:520px;border:1px solid #d7dce4}
.day-head{margin:16px 12px;background:#fff;border-radius:22px;padding:11px 14px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.day-head.today{background:var(--blue);color:#fff}
.count{width:28px;height:28px;border-radius:50%;border:1px solid #f4a11a;display:flex;align-items:center;justify-content:center;font-size:12px;color:#ef7d00;background:#fff}

.card{
  position:relative;
  background:#fff;
  margin:0 12px 12px;
  padding:14px 14px 10px;
  border-radius:8px;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
  font-size:12px;
  line-height:1.42;
  overflow:hidden;
  min-height:275px;
}
.card:after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:0;
  height:0;
  border-top:12px solid #aeb4bf;
  border-left:12px solid transparent;
}
.card h3{
  margin:0 0 8px;
  font-size:13px;
  font-weight:700;
}
.card-desc{
  white-space:normal;
  margin-bottom:10px;
}
.card-desc-primary{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-bottom:8px;
}
.card-desc-details{
  white-space:normal;
  margin-bottom:10px;
}
.activity-pill{
  display:inline-flex;
  align-items:center;
  padding:4px 10px;
  border:1px solid #3b82f6;
  border-radius:16px;
  color:#2563eb;
  background:#fff;
  font-size:12px;
  font-weight:700;
  line-height:1.2;
  margin-bottom:10px;
}
.card-meta{
  margin-top:6px;
  color:#273142;
}
.card-meta strong{
  font-weight:400;
  color:#111827;
}
.card-footer{
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid #e4e7ec;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.people-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-width:48px;
  padding:5px 10px;
  border-radius:16px;
  background:#ecfdf3;
  border:1px solid #a7e3b5;
  color:#166534;
  font-weight:700;
}
.avatar{
  width:28px;
  height:28px;
  border-radius:50%;
  background:#35b6d7;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:700;
  box-shadow:0 2px 4px rgba(0,0,0,.12);
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">breed</div>
  <div class="nav-item">CUSTOMERS</div><div class="nav-item">PROJECTS</div><div class="nav-item">PLANNING LINES</div>
  <div class="nav-item">SALES</div><div class="nav-item">PURCHASE</div><div class="nav-item">MESSAGE VIEW</div>
  <div class="nav-item">TABLES</div><div class="nav-item">SYSTEM</div>
  <div class="hello">Hello verkoop</div>
</div>

<div class="page">
  <div class="frame">
    <div class="planner-head">
      <div class="title-wrap">
        <h1>Related Planning Data</h1>
        <p>All project planning lines are listed here. Drag cards between date columns.</p>
      </div>

      <div class="toggle">
        <button>List view</button>
        <button class="active">Card view</button>
      </div>

      <button id="todayBtn" class="today-btn" type="button">Today</button>

      <div class="navigator">
        <button id="shiftPrev" class="circle-btn" type="button" aria-label="Previous period">‹</button>
        <button id="shiftNext" class="circle-btn" type="button" aria-label="Next period">›</button>
      </div>

      <div class="date-control">
        <button id="dateBtn" class="date-btn">
          <span>📅</span>
          <span id="dateBtnText" class="date-text">Aug 17, 2026 - Aug 23, 2026</span>
          <span id="weekBadge" class="week-badge">Week 34</span>
        </button>

        <div id="calendarPop" class="calendar-pop">
          <div class="calendar-top">
            <button id="calPrev" class="calendar-nav">‹</button>
            <div id="calTitle" class="calendar-title">August 2026</div>
            <button id="calNext" class="calendar-nav">›</button>
          </div>
          <div class="calendar-weekdays">
            <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
          <div class="calendar-actions">
            <button id="clearBtn" class="clear">Clear</button>
            <button id="applyBtn" class="apply">Apply</button>
          </div>
        </div>
      </div>

      <select id="viewMode" class="view-mode">
        <option value="day">Day</option>
        <option value="week" selected>Week</option>
        <option value="month">Month</option>
      </select>

      <button id="filterBtn" class="icon-btn filter-btn" type="button" aria-label="Open planning filters" title="Filters">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 5h16l-6.5 7.2v5.1l-3 1.7v-6.8L4 5Z" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>
      <select class="phase-select"><option>Please select</option></select>
      <button class="icon-btn">⚙</button>
      <input class="search" type="search" placeholder="Search">
    </div>

    
    <div id="filterOverlay" class="filter-overlay" aria-hidden="true">
      <section class="filter-modal" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
        <div class="filter-modal-header">
          <div>
            <h2 id="filterTitle" class="filter-modal-title">Filter Planning</h2>
            <p class="filter-modal-subtitle">Select values to narrow down the planning data.</p>
          </div>
          <button id="filterClose" class="filter-close" type="button" aria-label="Close filters">×</button>
        </div>

        <div class="filter-form-grid">
          <div class="filter-field">
            <label for="filterProject">Project</label>
            <select id="filterProject">
              <option value="">Select project</option>
              <option>Kemp - Wester - 1247</option>
              <option>de Groot - 560</option>
              <option>Van Dijk - 890</option>
            </select>
          </div>

          <div class="filter-field">
            <label for="filterCustomer">Customer</label>
            <select id="filterCustomer">
              <option value="">Select customer</option>
              <option>Kemp</option>
              <option>de Groot</option>
              <option>Van Dijk</option>
            </select>
          </div>

          <div class="filter-field">
            <label for="filterStatus">Status</label>
            <select id="filterStatus">
              <option value="">Select status</option>
              <option>Planned</option>
              <option>In progress</option>
              <option>Completed</option>
            </select>
          </div>

          <div class="filter-field">
            <label for="filterResource">Resource</label>
            <select id="filterResource">
              <option value="">Select resource</option>
              <option>AR</option>
              <option>MH</option>
              <option>JV</option>
            </select>
          </div>

          <div class="filter-field">
            <label for="filterActivities">Activities</label>
            <select id="filterActivities">
              <option value="">Select activities</option>
              <option>Stofferen</option>
              <option>Werkvoorbereiding</option>
              <option>Afbouw</option>
            </select>
          </div>

          <div aria-hidden="true"></div>

          <div class="filter-field">
            <label for="filterOperator">Operators</label>
            <select id="filterOperator">
              <option value="">Select operator</option>
              <option value="gte-now">&gt;= Date Now</option>
              <option value="lt-now">&lt; Date Now</option>
              <option value="last-month">&lt; Date now - Last Month</option>
              <option value="last-2-months">&lt; Date now - Last 2 Months</option>
              <option value="last-3-months">&lt; Date now - Last 3 Months</option>
              <option value="empty">Empty</option>
              <option value="from-to">From - To</option>
            </select>
          </div>

          <div class="filter-field">
            <label for="filterDateFrom">Date from</label>
            <input id="filterDateFrom" type="date" aria-label="Date from">
          </div>
        </div>

        <div class="filter-modal-footer">
          <button id="filterClear" class="filter-action" type="button">Clear all</button>
          <button id="filterApply" class="filter-action apply" type="button">Apply</button>
        </div>
      </section>
    </div>

    <div id="planningGrid" class="planning-grid"></div>
  </div>
</div>

<script>
const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monthFull=['January','February','March','April','May','June','July','August','September','October','November','December'];

let currentAnchor=new Date(2026,7,21);
let calendarCursor=new Date(2026,7,1);
let selectedStart=new Date(2026,7,17);
let selectedEnd=new Date(2026,7,23);
let tempStart=new Date(selectedStart);
let tempEnd=new Date(selectedEnd);

const planningGrid=document.getElementById('planningGrid');
const viewMode=document.getElementById('viewMode');
const calendarPop=document.getElementById('calendarPop');
const calendarGrid=document.getElementById('calendarGrid');
const calTitle=document.getElementById('calTitle');

const today = cleanDate(new Date());

function sameDate(a,b){
  return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
}
function cleanDate(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function pretty(d){return `${monthNames[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`}
function isoWeek(d){
  const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=x.getUTCDay()||7;
  x.setUTCDate(x.getUTCDate()+4-day);
  const y0=new Date(Date.UTC(x.getUTCFullYear(),0,1));
  return Math.ceil((((x-y0)/86400000)+1)/7);
}
function startOfWeekMonday(d){
  const x=new Date(d);
  const diff=(x.getDay()+6)%7;
  x.setDate(x.getDate()-diff);
  return x;
}
function updateDateButton(){
  if(selectedStart && selectedEnd){
    document.getElementById('dateBtnText').textContent=`${pretty(selectedStart)} - ${pretty(selectedEnd)}`;
    document.getElementById('weekBadge').textContent=`Week ${isoWeek(selectedStart)}`;
  }
}
function renderCalendar(){
  calendarGrid.innerHTML='';
  calTitle.textContent=`${monthFull[calendarCursor.getMonth()]} ${calendarCursor.getFullYear()}`;

  const first=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth(),1);
  const offset=(first.getDay()+6)%7;
  const start=new Date(first);
  start.setDate(first.getDate()-offset);

  for(let i=0;i<42;i++){
    const d=new Date(start);
    d.setDate(start.getDate()+i);

    const btn=document.createElement('button');
    btn.type='button';
    btn.textContent=d.getDate();
    btn.className='calendar-day';

    if(d.getMonth()!==calendarCursor.getMonth()) btn.classList.add('outside');

    const dd=cleanDate(d);
    const s=tempStart?cleanDate(tempStart):null;
    const e=tempEnd?cleanDate(tempEnd):null;

    if(s&&e&&dd>s&&dd<e) btn.classList.add('in-range');
    if(s&&sameDate(dd,s)) btn.classList.add('range-start');
    if(e&&sameDate(dd,e)) btn.classList.add('range-end');
    if(sameDate(dd,today)) btn.classList.add('today');

    btn.onclick=()=>{
      if(!tempStart || (tempStart&&tempEnd)){
        tempStart=new Date(d);
        tempEnd=null;
      }else{
        if(d<tempStart){
          tempEnd=new Date(tempStart);
          tempStart=new Date(d);
        }else{
          tempEnd=new Date(d);
        }
      }
      renderCalendar();
    };

    calendarGrid.appendChild(btn);
  }
}
function renderPlanning(){
  planningGrid.innerHTML='';
  const mode=viewMode.value;

  let dates=[];
  if(mode==='day'){
    dates=[new Date(currentAnchor)];
    planningGrid.style.gridTemplateColumns='minmax(260px,1fr)';
    
  }else if(mode==='week'){
    const start=startOfWeekMonday(currentAnchor);
    for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);dates.push(d)}
    planningGrid.style.gridTemplateColumns='repeat(7,minmax(230px,230px))';
    
  }else{
    const y=currentAnchor.getFullYear(),m=currentAnchor.getMonth();
    const last=new Date(y,m+1,0).getDate();
    for(let i=1;i<=last;i++) dates.push(new Date(y,m,i));
    planningGrid.style.gridTemplateColumns=`repeat(${dates.length}, minmax(230px,230px))`;
    
  }

  dates.forEach((d,idx)=>{
    const col=document.createElement('div'); col.className='day-col';
    col.dataset.date = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const head=document.createElement('div'); head.className='day-head'+(sameDate(d,today)?' today':'');
    head.innerHTML=`<span>${dayNames[d.getDay()]} ${d.getDate()} ${monthNames[d.getMonth()]}</span><span class="count">${(idx%3)+1}</span>`;
    col.appendChild(head);

    const card=document.createElement('div'); card.className='card';
    const visualCards = [
      {
        title:'Kemp - Wester - 1247',
        lines:[
          'KLANT ZELF -',
          'Kamer ontruimen',
          '- Radiatoren verwijderen en afvoeren',
          '- Grenen vloer verwijderen en afvoeren',
          '- Vochtprobleem aanbouw aanpakken',
          '- Cementdekvloer waar nodig aansmeren'
        ],
        activity:'Stofferen',
        span:8,
        people:1,
        avatar:'AR'
      },
      {
        title:'de Groot - 560',
        lines:[
          'Werkvoorbereiding',
          'Leiding frezen - na de bouwvak',
          '- Materiaal controleren',
          '- Werkplek voorbereiden',
          '- Afstemming met uitvoerder'
        ],
        activity:'Werkvoorbereiding',
        span:3,
        people:0,
        avatar:'MH'
      },
      {
        title:'Van Dijk - 890',
        lines:[
          'AFBOUW -',
          'Wanden voorbereiden',
          '- Primer aanbrengen',
          '- Schilderwerk controleren',
          '- Opleverpunten verwerken'
        ],
        activity:'Afbouw',
        span:5,
        people:2,
        avatar:'JV'
      }
    ];

    const v = visualCards[(d.getDate()+idx)%visualCards.length];
    const startDate = `${String(d.getDate()).padStart(2,'0')} ${monthNames[d.getMonth()]} ${d.getFullYear()}`;
    const endDateObj = new Date(d);
    endDateObj.setDate(endDateObj.getDate()+v.span);
    const endDate = `${String(endDateObj.getDate()).padStart(2,'0')} ${monthNames[endDateObj.getMonth()]} ${endDateObj.getFullYear()}`;

    const primaryDescription = v.lines[0] || '';
    const remainingDescription = v.lines.slice(1);

    card.innerHTML=`
      <h3>${v.title}</h3>
      <div class="card-desc-primary">${primaryDescription}</div>
      <div class="activity-pill">${v.activity}</div>
      ${remainingDescription.length ? `<div class="card-desc-details">${remainingDescription.join('<br>')}</div>` : ''}
      <div class="card-meta"><strong>Date:</strong>&nbsp; ${startDate} - ${endDate}</div>
      <div class="card-meta"><strong>Start time:</strong>&nbsp; 12:00 PM</div>
      <div class="card-meta"><strong>End time:</strong>&nbsp; 12:00 PM</div>
      <div class="card-footer">
        <span class="people-pill">👥 ${v.people}</span>
        <span class="avatar">${v.avatar}</span>
      </div>`;
    col.appendChild(card);

    planningGrid.appendChild(col);
  });
}

document.getElementById('dateBtn').onclick=()=>{
  tempStart=selectedStart?new Date(selectedStart):null;
  tempEnd=selectedEnd?new Date(selectedEnd):null;
  calendarCursor=tempStart?new Date(tempStart.getFullYear(),tempStart.getMonth(),1):new Date();
  renderCalendar();
  calendarPop.classList.toggle('show');
};
document.getElementById('calPrev').onclick=()=>{calendarCursor.setMonth(calendarCursor.getMonth()-1);renderCalendar()};
document.getElementById('calNext').onclick=()=>{calendarCursor.setMonth(calendarCursor.getMonth()+1);renderCalendar()};
document.getElementById('clearBtn').onclick=()=>{tempStart=null;tempEnd=null;selectedStart=null;selectedEnd=null;document.getElementById('dateBtnText').textContent='Select date or date range';document.getElementById('weekBadge').textContent='';renderCalendar()};
document.getElementById('applyBtn').onclick=()=>{
  if(!tempStart)return;
  selectedStart=new Date(tempStart);
  selectedEnd=tempEnd?new Date(tempEnd):new Date(tempStart);
  currentAnchor=new Date(selectedStart);
  updateDateButton();
  calendarPop.classList.remove('show');
  renderPlanning();
};

function syncSelectionToView(anchorDate=currentAnchor){
  const anchor = cleanDate(anchorDate);
  currentAnchor = new Date(anchor);

  if(viewMode.value==='week'){
    const start = startOfWeekMonday(anchor);
    selectedStart = new Date(start);
    selectedEnd = new Date(start);
    selectedEnd.setDate(start.getDate()+6);
  }else if(viewMode.value==='month'){
    selectedStart = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    selectedEnd = new Date(anchor.getFullYear(), anchor.getMonth()+1, 0);
  }else{
    selectedStart = new Date(anchor);
    selectedEnd = new Date(anchor);
  }

  calendarCursor = new Date(currentAnchor.getFullYear(), currentAnchor.getMonth(), 1);
  updateDateButton();
}

function scrollToDateInGrid(dateToShow){
  const targetDate = cleanDate(dateToShow);
  requestAnimationFrame(()=>{
    const key = `${targetDate.getFullYear()}-${String(targetDate.getMonth()+1).padStart(2,'0')}-${String(targetDate.getDate()).padStart(2,'0')}`;
    const target = planningGrid.querySelector(`[data-date="${key}"]`);
    if(target){
      target.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
    }
  });
}

function shiftPeriod(step){
  const base = new Date(currentAnchor);

  if(viewMode.value==='week'){
    base.setDate(base.getDate() + (step * 7));
  }else if(viewMode.value==='month'){
    base.setMonth(base.getMonth() + step);
  }else{
    base.setDate(base.getDate() + step);
  }

  syncSelectionToView(base);
  renderCalendar();
  renderPlanning();
  calendarPop.classList.remove('show');
  scrollToDateInGrid(currentAnchor);
}

viewMode.onchange=()=>{
  syncSelectionToView(currentAnchor);
  renderPlanning();
  renderCalendar();
  scrollToDateInGrid(currentAnchor);
};

function scrollToToday(){
  syncSelectionToView(today);
  renderCalendar();
  renderPlanning();
  calendarPop.classList.remove('show');
  scrollToDateInGrid(today);
}

document.getElementById('todayBtn').onclick=scrollToToday;
document.getElementById('shiftPrev').onclick=()=>shiftPeriod(-1);
document.getElementById('shiftNext').onclick=()=>shiftPeriod(1);

const filterBtn = document.getElementById('filterBtn');
const filterOverlay = document.getElementById('filterOverlay');
const filterClose = document.getElementById('filterClose');
const filterClear = document.getElementById('filterClear');
const filterApply = document.getElementById('filterApply');
const filterControls = Array.from(filterOverlay.querySelectorAll('select, input'));

function openFilters(){
  filterOverlay.classList.add('show');
  filterOverlay.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  document.getElementById('filterProject').focus();
}

function closeFilters(){
  filterOverlay.classList.remove('show');
  filterOverlay.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  filterBtn.focus();
}

function updateFilterButtonState(){
  const hasFilters = filterControls.some(control => control.value !== '');
  filterBtn.classList.toggle('active', hasFilters);
  filterBtn.title = hasFilters ? 'Filters applied' : 'Filters';
}

filterBtn.addEventListener('click', openFilters);
filterClose.addEventListener('click', closeFilters);
filterOverlay.addEventListener('click', event=>{
  if(event.target===filterOverlay) closeFilters();
});
document.addEventListener('keydown', event=>{
  if(event.key==='Escape' && filterOverlay.classList.contains('show')) closeFilters();
});
filterClear.addEventListener('click', ()=>{
  filterControls.forEach(control=>{ control.value=''; });
  updateFilterButtonState();
});
filterApply.addEventListener('click', ()=>{
  updateFilterButtonState();
  closeFilters();
});

// Make the phase dropdown 80% wider than its current rendered width.
const phaseSelect = document.querySelector('.phase-select');
if (phaseSelect) {
  const currentWidth = phaseSelect.getBoundingClientRect().width;
  phaseSelect.style.width = `${Math.round(currentWidth * 1.8)}px`;
}

syncSelectionToView(currentAnchor);
renderCalendar();
renderPlanning();
</script>
</body>
</html>
